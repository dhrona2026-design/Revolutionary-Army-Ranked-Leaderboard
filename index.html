<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revolutionary Army Leaderboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --gold: #ffd700;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
            --discord-color: #5865f2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
        }

        /* Pure CSS Tab System Configuration */
        .tab-system {
            display: flex;
            flex-direction: column;
        }

        .radio-input {
            display: none;
        }

        .tabs-header-bar {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            background: var(--card-bg);
            padding: 0.5rem;
            border-radius: 8px;
        }

        .tab-label {
            color: var(--text-muted);
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s ease;
            user-select: none;
        }

        .tab-label:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        /* Show/Hide regions cleanly without active scripting */
        .region-content {
            display: none;
        }

        #radio-india:checked ~ .tabs-header-bar label[for="radio-india"],
        #radio-oce:checked ~ .tabs-header-bar label[for="radio-oce"],
        #radio-global:checked ~ .tabs-header-bar label[for="radio-global"] {
            background: var(--accent-color);
            color: #fff;
        }

        #radio-india:checked ~ .leaderboard-card #content-india,
        #radio-oce:checked ~ .leaderboard-card #content-oce,
        #radio-global:checked ~ .leaderboard-card #content-global {
            display: block;
        }

        .cta-container {
            text-align: center;
            margin-bottom: 2rem;
        }

        .discord-btn {
            display: inline-block;
            background-color: var(--discord-color);
            color: #fff;
            text-decoration: none;
            padding: 0.8rem 1.8rem;
            font-weight: 700;
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(88, 101, 242, 0.4);
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        .discord-btn:hover {
            background-color: #4752c4;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(88, 101, 242, 0.6);
        }

        .leaderboard-card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            margin-bottom: 2.5rem;
        }

        .table-header, .player-row {
            display: grid;
            grid-template-columns: 1.5fr 3.5fr 2fr 2fr;
            padding: 1rem 1.5rem;
            align-items: center;
        }

        .table-header {
            background: rgba(0, 0, 0, 0.2);
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .player-row {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s ease;
        }

        .player-row:last-child {
            border-bottom: none;
        }

        .player-row:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .rank {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .rank.gold { color: var(--gold); text-shadow: 0 0 8px rgba(255, 215, 0, 0.3); }
        .rank.silver { color: var(--silver); text-shadow: 0 0 8px rgba(192, 192, 192, 0.3); }
        .rank.bronze { color: var(--bronze); text-shadow: 0 0 8px rgba(205, 127, 50, 0.3); }

        .player-identity {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .avatar-img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            background-color: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .player-row:hover .avatar-img {
            border-color: var(--accent-color);
        }

        .name a {
            font-weight: 600;
            color: var(--text-main);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .name a:hover {
            color: var(--accent-color);
            text-decoration: underline;
        }

        .win-rate {
            color: #10b981;
            font-weight: 600;
        }

        .points {
            font-weight: 700;
            color: #f59e0b;
        }

        .about-section {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border-left: 4px solid var(--accent-color);
        }

        .about-section h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #fff;
        }

        .about-section p {
            color: var(--text-muted);
            line-height: 1.6;
            font-size: 1.05rem;
            margin-bottom: 1.25rem;
        }

        .bounty-badge-container {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .bounty-badge {
            background: rgba(0, 0, 0, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .bounty-badge span {
            color: #ef4444;
            font-weight: 700;
        }

        .empty-message {
            padding: 2.5rem;
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container-wrapper" style="width: 100%; max-width: 800px;">
        <header>
            <h1>Crew Leaderboard</h1>
            <p>Blox Fruits Regional & Global Standings</p>
        </header>

        <!-- Hidden Radio Inputs for Tab Control Logic -->
        <input type="radio" name="region-tabs" id="radio-india" class="radio-input" checked>
        <input type="radio" name="region-tabs" id="radio-oce" class="radio-input">
        <input type="radio" name="region-tabs" id="radio-global" class="radio-input">

        <div class="tabs-header-bar">
            <label for="radio-india" class="tab-label">India</label>
            <label for="radio-oce" class="tab-label">OCE</label>
            <label for="radio-global" class="tab-label">Global</label>
        </div>

        <div class="cta-container">
            <a href="https://discord.gg" target="_blank" class="discord-btn">
                Wanna join our ranked tournaments? Join our crew using the discord link below
            </a>
        </div>

        <div class="leaderboard-card">
            <div class="table-header">
                <div>Rank</div>
                <div>Player</div>
                <div>Win Rate</div>
                <div>Points</div>
            </div>

            <!-- INDIA DATA PANEL -->
            <div id="content-india" class="region-content">
                <div class="player-row">
                    <div class="rank gold">Gold</div>
                    
                        <img class="avatar-img" src="https://discordapp.com" alt="Noctix">
                        <div class="name"><a href="https://discord.com" target="_blank">Noctix</a></div>
                    </div>
                    <div class="win-rate">100%</div>
                    <div class="points">100 pts</div>
                </div>
                <div class="player-row">
                    <div class="rank silver">Silver</div>
                    
                        <img class="avatar-img" src="https://discordapp.com" alt="Giyu_San">
                        <div class="name"><a href="https://discord.com" target="_blank">Giyu_San</a></div>
                    </div>
                    <div class="win-rate">50%</div>
                    <div class="points">75 pts</div>
                </div>
                <div class="player-row">
                    <div class="rank bronze">Bronze</div>
                    
                        <img class="avatar-img" src="https://discordapp.com" alt="MonkeyD Luffy">
